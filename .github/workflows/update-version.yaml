name: update-version
on: 
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  update-version:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: git init
        run: |
          git config --global user.email ${{ secrets.email }}
          git config --global user.name "codetiger666"
          git config pull.rebase false
      
      - name: get new version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          chatId: ${{ secrets.TG_BOT_USER_ID }}
          tgContentBotKey: ${{ secrets.TG_CONTENT_BOT_KEY }}
        run: |
          export TZ=Asia/Shanghai
          source init/common.sh
          while IFS= read -r line; do
          # 跳过空行
          [[ -z "$line" ]] && continue

          # 使用 awk 分割字段，并用特殊分隔符（如 \x1F）连接
          formatted_line=$(echo "$line" | awk -F "---" '{
            for (i=1; i<=6; i++) {  # 假设最多 6 个字段
              printf "%s\x1F", $i    # 用不可见字符 \x1F 分隔字段
            }
            print ""  # 换行
          }')

          # 设置 IFS 为 \x1F，将字段读入独立变量
          IFS=$'\x1F' read -r program version repo location handle new <<< "$formatted_line"
          # 去除 key 和 value 两边的空白（可选）
          program=$(echo "$program" | xargs)
          export project_program=$program
          version=$(echo "$version" | xargs)
          new_version=
          pkgVersion=$(apply_handle "$handle" "$new_version")
          if [[ -z "$program" || -z "$version" || -z "$repo" ]]; then
            # 如果任意一个变量为空，跳过当前循环迭代
            continue
          fi
          new_version=$(get_latest_version "$location" "$repo")
          temp_version=$new_version
          new_version=$(apply_handle "$handle" "$new_version" "$new")
          if [[ -z "$new_version" ]]; then
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] 未获取到最新版本，跳过当前循环"
            continue
          fi
          echo -e "\n[$(date '+%Y-%m-%d %H:%M:%S')] $program获取到的最新版本${new_version}"
          if [ "$version" = "$new_version" ]; then
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $program最新版本已经编译过"
              reqData=$(jq -cn \
              --arg chatId "${{ secrets.TG_BOT_USER_ID }}" \
              --arg program "$program" \
              --arg new_version "$new_version" \
              --arg repo "$repo" \
              --arg temp_version "$temp_version" \
              '{
                  chat_id: $chatId,
                  text: (
                      "\\[" + ($program | gsub("-"; "\\-")) + "\\] \\[⭕ 已经编译完成\\]\n" +
                      "版本:`" + ($new_version | gsub("\\."; "\\.")) + "`"
                  ),
                  parse_mode: "MarkdownV2",
                  reply_markup: {
                      inline_keyboard: [
                          [
                              {
                                  text: ($program + " " + $new_version + "更新日志"),
                                  url: ("https://github.com/" + $repo + "/releases/tag/" + $temp_version)
                              }
                          ]
                      ]
                  }
              }')
              send_telegram_message "${{ secrets.TG_BOT_KEY }}" "$reqData"
              sleep 10
              continue
            else
              run_workflow=$(github_api_request "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" GET | jq '.workflow_runs[] | select((.name == "release" or .name == "release-deb") and (.status == "queued" or .status == "in_progress"))')
              while true; do
                # 如果变量 a 为空，跳过当前循环
                if [ -z "$run_workflow" ]; then
                  break
                fi
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] 当前有编译任务进行中，等待30s后重试"
                reqData=$(jq -cn \
                --arg chatId "${{ secrets.TG_BOT_USER_ID }}" \
                --arg project_program "$project_program" \
                --arg project_version "$project_version" \
                --arg arch "$arch" \
                '{
                    chat_id: $chatId,
                    text: (
                        "\\[" + ($project_program | gsub("-"; "\\-")) + "\\] \\[🟡 等待编译\\]\n" +
                        "版本`" + ($project_version | gsub("\\."; "\\.")) + "`\n" +
                        "当前有任务正在编译中，等待60s后继续"
                    ),
                    parse_mode: "MarkdownV2"
                }')
                send_telegram_message "${{ secrets.TG_BOT_KEY }}" "$reqData"
                sleep 60
                run_workflow=$(github_api_request "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" GET | jq '.workflow_runs[] | select((.name == "release" or .name == "release-deb") and (.status == "queued" or .status == "in_progress"))')
              done
              reqData=$(jq -cn \
              --arg chatId "${{ secrets.TG_BOT_USER_ID }}" \
              --arg program "$program" \
              --arg new_version "$new_version" \
              --arg repo "$repo" \
              --arg temp_version "$temp_version" \
              '{
                  ref: "main",
                  inputs: {
                    program: $program,
                    version: $new_version,
                    remove: "true",
                    ssh: "false"
                  },
              }')
              github_api_request "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches" POST $reqData
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $program触发编译版本(RPM):${new_version}"
              reqData=$(jq -cn \
              --arg chatId "${{ secrets.TG_BOT_USER_ID }}" \
              --arg program "$program" \
              --arg new_version "$new_version" \
              --arg repo "$repo" \
              --arg temp_version "$temp_version" \
              '{
                  chat_id: $chatId,
                  text: (
                      "\\[" + ($program | gsub("-"; "\\-")) + "\\] \\[🟢 触发编译\\]\n" +
                      "版本:`" + ($new_version | gsub("\\."; "\\.")) + "`\n" + 
                      "包类型: rpm"
                  ),
                  parse_mode: "MarkdownV2",
                  reply_markup: {
                      inline_keyboard: [
                          [
                              {
                                  text: ($program + " " + $new_version + "更新日志"),
                                  url: ("https://github.com/" + $repo + "/releases/tag/" + $temp_version)
                              }
                          ]
                      ]
                  }
              }')
              send_telegram_message "${{ secrets.TG_BOT_KEY }}" "$reqData"
              # 等待 release.yml 执行完毕，再触发 release-deb.yml
              sleep 60
              reqData=$(jq -cn \
              --arg chatId "${{ secrets.TG_BOT_USER_ID }}" \
              --arg program "$program" \
              --arg new_version "$new_version" \
              --arg repo "$repo" \
              --arg temp_version "$temp_version" \
              '{
                  ref: "main",
                  inputs: {
                    program: $program,
                    version: $new_version,
                    remove: "true",
                    ssh: "false"
                  },
              }')
              run_release_workflow=$(github_api_request "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" GET | jq '.workflow_runs[] | select((.name == "release" or .name == "release-deb") and (.status == "queued" or .status == "in_progress"))')
              while true; do
                if [ -z "$run_release_workflow" ]; then
                  break
                fi
                echo "[$(date '+%Y-%m-%d %H:%M:%S')] release.yml 编译任务进行中，等待60s后检查"
                reqData=$(jq -cn \
                --arg chatId "${{ secrets.TG_BOT_USER_ID }}" \
                --arg project_program "$project_program" \
                --arg project_version "$project_version" \
                --arg arch "$arch" \
                '{
                    chat_id: $chatId,
                    text: (
                        "\\[" + ($project_program | gsub("-"; "\\-")) + "\\] \\[🟡 等待编译\\]\n" +
                        "版本`" + ($project_version | gsub("\\."; "\\.")) + "`\n" +
                        "当前有任务正在编译中，等待60s后继续"
                    ),
                    parse_mode: "MarkdownV2"
                }')
                send_telegram_message "${{ secrets.TG_BOT_KEY }}" "$reqData"
                sleep 60
                run_release_workflow=$(github_api_request "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100" GET | jq '.workflow_runs[] | select((.name == "release" or .name == "release-deb") and (.status == "queued" or .status == "in_progress"))')
              done
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] release.yml 编译完成，开始触发 release-deb.yml"
              reqData=$(jq -cn \
              --arg chatId "${{ secrets.TG_BOT_USER_ID }}" \
              --arg program "$program" \
              --arg new_version "$new_version" \
              --arg repo "$repo" \
              --arg temp_version "$temp_version" \
              '{
                  ref: "main",
                  inputs: {
                    program: $program,
                    version: $new_version,
                    remove: "true",
                    ssh: "false"
                  },
              }')
              github_api_request "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release-deb.yml/dispatches" POST $reqData || true
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $program触发编译版本(DEB):${new_version}"
              reqData=$(jq -cn \
              --arg chatId "${{ secrets.TG_BOT_USER_ID }}" \
              --arg program "$program" \
              --arg new_version "$new_version" \
              --arg repo "$repo" \
              --arg temp_version "$temp_version" \
              '{
                  chat_id: $chatId,
                  text: (
                      "\\[" + ($program | gsub("-"; "\\-")) + "\\] \\[🟢 触发编译\\]\n" +
                      "版本:`" + ($new_version | gsub("\\."; "\\.")) + "`\n" + 
                      "包类型: deb"
                  ),
                  parse_mode: "MarkdownV2",
                  reply_markup: {
                      inline_keyboard: [
                          [
                              {
                                  text: ($program + " " + $new_version + "更新日志"),
                                  url: ("https://github.com/" + $repo + "/releases/tag/" + $temp_version)
                              }
                          ]
                      ]
                  }
              }')
              send_telegram_message "${{ secrets.TG_BOT_KEY }}" "$reqData"
              sleep 10
            fi
          done < version