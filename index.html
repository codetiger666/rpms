<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>自编译软件仓库</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css"/>
    <style>
        #app,
        .file-manager,
        .list-grid {
            overflow: visible !important;
        }

        .file-manager {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 100vh;
            padding: 20px;
            background: #f0f0f0;
        }

        .path-bar,
        .repo-box,
        .list-grid {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .1);
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .list-grid {
            display: grid;
            grid-template-columns:
 repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }

        .file-item {
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: .3s;
        }

        .file-item:hover {
            background: #f5f5f5;
        }

        .file-icon {
            font-size: 48px;
        }

        .folder-icon {
            color: #ffc107;
        }

        .file-name {
            margin-top: 8px;
            font-size: 12px;
            word-break: break-all;
        }

        .context-menu {
            position: fixed !important;
            z-index: 10000 !important;
            min-width: 160px;
            background: rgba(255, 255, 255, .85) !important;
            backdrop-filter: blur(5px);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
            padding: 5px 0;
        }

        .context-menu .el-menu-item {
            margin: 4px 8px;
            width: calc(100% - 16px);
            border-radius: 6px;
            background: rgba(255, 255, 255, .5) !important;
        }

        .context-menu .el-menu-item:hover {
            background: rgba(255, 255, 255, .8) !important;
        }

        .repo-box textarea {
            font-family: Consolas,
            monospace;
            font-size: 13px;
        }
        
    </style>
</head>
<body>
<div id="app">
    <div class="file-manager">
        <!-- 软件源配置 -->
        <div class="repo-box">
            <div class="section-title">
                软件源使用方法
            </div>
            <el-collapse>
                <el-collapse-item
                        title="RPM 软件源"
                        name="rpm">
                    <p>
                        保存配置：
                        <code>/etc/yum.repos.d/codetiger.repo</code>
                    </p>
                    <el-input
                            type="textarea"
                            readonly
                            :rows="8"
                            :value="repoConfig.rpm">
                    </el-input>
                </el-collapse-item>
                <el-collapse-item
                        title="DEB 软件源"
                        name="deb">
                    <p>
                        保存配置：
                        <code>/etc/apt/sources.list.d/codetiger.list</code>
                    </p>
                    <el-input
                            type="textarea"
                            readonly
                            :rows="5"
                            :value="repoConfig.deb">
                    </el-input>
                </el-collapse-item>
            </el-collapse>
        </div>
        <!-- 路径 -->
        <el-breadcrumb
                class="path-bar"
                separator="/">
            <el-breadcrumb-item
                    v-for="(item,i) in pathItems"
                    :key="i"
                    @click.native="navigateTo(i)">
                {{item}}
            </el-breadcrumb-item>
        </el-breadcrumb>
        <!-- 文件夹 -->
        <div
                class="section"
                v-if="folders.length">
            <div class="section-title">
                文件夹
            </div>
            <div class="list-grid">
                <div
                        v-for="f in folders"
                        :key="f.path"
                        class="file-item"
                        @dblclick="openFolder(f)"
                        @contextmenu.prevent="showContextMenu(f,$event)"
                        @touchstart="onTouchStart(f,$event)"
                        @touchend="onTouchEnd"
                        @touchmove="onTouchMove">
                    <i class="file-icon el-icon-folder folder-icon"></i>
                    <div class="file-name">
                        {{f.name}}
                    </div>
                </div>
            </div>
        </div>
        <!-- 文件 -->
        <div
                class="section"
                v-if="files.length">
            <div class="section-title">
                文件
            </div>
            <div class="list-grid">
                <div
                        v-for="f in files"
                        :key="f.path"
                        class="file-item"
                        @contextmenu.prevent="showContextMenu(f,$event)"
                        @touchstart="onTouchStart(f,$event)"
                        @touchend="onTouchEnd"
                        @touchmove="onTouchMove">
                    <i class="file-icon el-icon-document"></i>
                    <div class="file-name">
                        {{f.name}}
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- 菜单 -->
    <el-menu
            class="context-menu"
            v-show="contextMenu.visible"
            :style="{left:contextMenu.x+'px',top:contextMenu.y+'px'}"
            @select="handleMenuClick">
        <el-menu-item
                index="download"
                v-if="contextMenu.target?.isFile">
            <i class="el-icon-download"></i>
            下载
        </el-menu-item>
        <el-menu-item
                index="open"
                v-if="!contextMenu.target?.isFile">
            <i class="el-icon-folder-opened"></i>
            打开
        </el-menu-item>
    </el-menu>
</div>
<script src="https://unpkg.com/vue@2.6.14/dist/vue.js"></script>
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script>
    const apiBase =
        'https://api.github.com';
    const repo =
        'codetiger666/rpms';
    const branch =
        'release';
    // 仓库配置
    const repoConfig = {
        rpm:
            `[codetiger]
name=$releasever - codetiger
baseurl=https://codetiger666.github.io/rpms/redhat/$releasever/$basearch/
enabled=1
gpgcheck=0
skip_if_unavailable=1
priority=1
metadata_expire=0`,
        deb:
            `deb [trusted = yes] https://codetiger666.github.io/rpms/debian buster main`
    };
    new Vue({
        el: '#app',
        data() {
            return {
                repoConfig,
                currentPath: '',
                allItems: [],
                contextMenu: {
                    visible: false,
                    x: 0,
                    y: 0,
                    target: null
                },
                longPressTimer: null
            };
        },
        computed: {
            pathItems() {
                return [
                    'root',
                    ...this.currentPath
                        .split('/')
                        .filter(Boolean)
                ];
            },
            folders() {
                return this.allItems.filter(
                    i => !i.isFile
                );
            },
            files() {
                return this.allItems.filter(
                    i => i.isFile
                );
            }
        },
        methods: {
            async loadFiles(path = '') {
                try {
                    let url =
                        `${apiBase}/repos/${repo}/contents/${path}?ref=${branch}`;
                    let res =
                        await fetch(url);
                    let data =
                        await res.json();
                    this.allItems =
                        data
                            .filter(i =>
                                ![
                                    'index.html',
                                    'README.md'
                                ]
                                    .includes(i.name)
                            )
                            .map(i => ({
                                name: i.name,
                                path: i.path,
                                isFile: i.type === 'file',
                                url: i.download_url
                            }));
                } catch (e) {
                    console.error(e);
                    this.$message.error(
                        '加载文件列表失败'
                    );
                }
            },
            showContextMenu(item, event) {
                this.contextMenu.target = item;
                this.contextMenu.x = event.clientX;
                this.contextMenu.y = event.clientY;
                this.contextMenu.visible = true;
            },
            onTouchStart(item, event) {
                this.contextMenu.target = item;
                clearTimeout(this.longPressTimer);
                this.longPressTimer = setTimeout(() => {
                    let t = event.touches[0];
                    this.contextMenu.x = t.clientX;
                    this.contextMenu.y = t.clientY;
                    this.contextMenu.visible = true;
                }, 600);
            },
            onTouchEnd() {
                clearTimeout(this.longPressTimer);
            },
            onTouchMove() {
                clearTimeout(this.longPressTimer);
            },
            handleMenuClick(cmd) {
                this.contextMenu.visible = false;
                let t = this.contextMenu.target;
                if (cmd === 'download') {
                    window.open(t.url);
                }
                if (cmd === 'open') {
                    this.openFolder(t);
                }
            },
            openFolder(item) {
                this.currentPath = item.path;
                this.loadFiles(item.path);
            },
            navigateTo(index) {
                let p = this.pathItems
                    .slice(1, index + 1);
                this.currentPath = p.join('/');
                this.loadFiles(this.currentPath);
            }
        },
        mounted() {
            this.loadFiles();
            document.addEventListener(
                'click',
                () => {
                    this.contextMenu.visible = false;
                });
        }
    });
</script>
</body>
</html>
